<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mengarahkan ke Cybersecurity Learning Suite...</title>
  <meta http-equiv="refresh" content="0; url=12-ApplicationLayerDDoS.html">

  <script>
    // Redirect instan dan mempertahankan hash/search query jika ada
    window.location.replace("12-ApplicationLayerDDoS.html" + window.location.search + window.location.hash);
  </script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0F3B5F;
      color: #EAF4FB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .card {
      background: rgba(10, 44, 71, 0.85);
      border: 1px solid rgba(127, 211, 255, 0.3);
      border-radius: 12px;
      padding: 32px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #7FD3FF;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 10px;
      color: #fff;
    }

    p {
      font-size: 0.92rem;
      line-height: 1.5;
      color: rgba(234, 244, 251, 0.78);
      margin: 0 0 20px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(127, 211, 255, 0.2);
      border-top-color: #7FD3FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    a.btn {
      display: inline-block;
      padding: 10px 18px;
      background: #7FD3FF;
      color: #0A2C47;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 700;
      border-radius: 6px;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    a.btn:hover {
      background: #a9e3ff;
      transform: translateY(-1px);
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="badge">INFORMATICS · UC</div>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Memuat Cybersecurity Learning Suite</h1>
    <p>Anda sedang diarahkan ke modul <b>Topic 01: Application Layer DDoS</b>...</p>
